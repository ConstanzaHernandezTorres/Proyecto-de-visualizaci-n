<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Cinturón de Fuego — Riesgo Volcánico y Población</title>

  <!-- Tipografía -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <!-- Estilos -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Librerías D3 y Tone.js -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://unpkg.com/topojson-client@3/dist/topojson-client.min.js"></script>
  <script src="https://unpkg.com/tone@14.8.49/build/Tone.js"></script>
</head>
<body>

  <!-- CABECERA MÍNIMA -->
  <header class="app-header">
    <h1 class="main-title">El Cinturón de Fuego <span class="title-sub">· Fuerza Geológica (VEI) vs. Población en Zona de Evacuación (10 km)</span></h1>
    <div class="source-credit">Smithsonian GVP & LandScan</div>
  </header>

  <!-- VISUALIZACIÓN PRINCIPAL -->
  <main class="stage-container">
    <div id="viz-stage" class="viz-stage">
      


      <!-- CONTROLES DE ZOOM -->
      <div class="zoom-controls" aria-label="Controles de zoom">
        <button id="btn-zoom-in" class="btn-zoom" type="button" title="Acercar">+</button>
        <button id="btn-zoom-out" class="btn-zoom" type="button" title="Alejar">−</button>
        <button id="btn-zoom-reset" class="btn-zoom" type="button" title="Restablecer vista">⟲</button>
      </div>

      <!-- LIENZO SVG D3 -->
      <svg id="viz-svg" class="viz-svg"></svg>

      <!-- FICHA ESENCIAL DEL VOLCÁN -->
      <aside id="inspector-card" class="inspector-card" aria-label="Volcán seleccionado">
        <div class="ins-main">
          <h2 id="det-title" class="ins-name">Campi Flegrei</h2>
          <span id="det-country" class="ins-country">Italia</span>
        </div>

        <div class="ins-metrics">
          <div class="ins-metric">
            <span class="ins-metric-lbl">Explosividad</span>
            <span id="det-vei" class="ins-metric-val val-vei">VEI 5</span>
          </div>
          <div class="ins-metric">
            <span class="ins-metric-lbl">Evacuación (10 km)</span>
            <span id="det-pop" class="ins-metric-val val-pop">2.234.109 hab.</span>
          </div>
        </div>
      </aside>

      <!-- LEYENDA COMPACTA -->
      <div class="viz-legend" aria-label="Leyenda">
        <div class="legend-group">
          <span class="legend-title">VEI (Explosividad)</span>
          <div class="legend-gradient"></div>
          <div class="legend-nums"><span>0</span><span>2</span><span>4</span><span>7</span></div>
        </div>
        <div class="legend-group">
          <span class="legend-title">Población (a 10 km)</span>
          <div class="legend-dots">
            <span class="d d1"></span>
            <span class="d d2"></span>
            <span class="d d3"></span>
          </div>
          <div class="legend-nums"><span>0</span><span>10k</span><span>1M+</span></div>
        </div>
      </div>

      <!-- TOOLTIP -->
      <div id="tooltip" class="tooltip"></div>

    </div>
  </main>

  <script src="js/audio.js"></script>
  <script src="js/viz.js"></script>
</body>
</html>
